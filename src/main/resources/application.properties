spring.application.name=bizradar

# 가상 스레드 on (I/O 대기 많은 워크로드에 맞음)
spring.threads.virtual.enabled=true

# DB 접속 (로컬 개발용 계정)
spring.datasource.url=jdbc:mysql://localhost:3307/bizradar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=bizradar
spring.datasource.password=bizradar

# 커넥션 풀 고정 (핀닝 대비, 근거서 D2)
spring.datasource.hikari.maximum-pool-size=20

# 뜰 때 V1__init.sql 자동 적용
spring.flyway.enabled=true

# url_hash -> urlHash 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true

# Actuator: 기본은 health만 노출 -> 명시적으로 열기
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

#로컬 시크릿 파일 병합
spring.config.import=optional:file:./application-local.properties

#네이버 뉴스 API
naver.news.base-url=https://naverapihub.apigw.ntruss.com/search/v1/news

#Gemini (요약용)
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.6-flash