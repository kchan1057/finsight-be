services:
  mysql:
    image: mysql:8.4
    container_name: finsight-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bizradar
      MYSQL_USER: bizradar
      MYSQL_PASSWORD: bizradar
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: finsight-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: finsight-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mysql-data: